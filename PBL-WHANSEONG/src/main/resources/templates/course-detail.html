<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${course.name} + ' · 강의평가'">강의평가</title>
    <link rel="icon" type="image/png" th:href="@{/images/changshin-logo.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="topbar">
    <a class="brand" th:href="@{/courses}">
        <img class="brand-logo" th:src="@{/images/changshin-logo.png}" alt="창신대학교 로고">
        <span>창신대 수강신청 <small>맞춤 수강 도우미</small></span>
    </a>
    <nav>
        <a th:href="@{/courses}" class="active">강의 목록</a>
        <a th:href="@{/recommend}">추천 시간표</a>
        <a th:href="@{/my}">내 신청내역</a>
        <a th:href="@{/graduation}">졸업요건</a>
    </nav>
    <div class="user">
        <span th:text="${student.name} + ' (' + ${student.department} + ' ' + ${student.grade} + '학년)'">학생</span>
        <a th:href="@{/logout}">로그아웃</a>
    </div>
</header>

<div class="container">

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <a th:href="@{/courses}" class="btn btn-ghost btn-sm" style="margin-bottom:14px;">← 강의 목록</a>

    <!-- 강의 정보 -->
    <div class="card">
        <h2 class="page-title" th:text="${course.name}">과목명</h2>
        <p class="subtitle">
            <span th:text="${course.courseCode}"></span> ·
            <span th:text="${course.professor} + ' 교수'"></span> ·
            <span th:text="${course.department}"></span> ·
            <span th:text="${course.scheduleLabel} + ' (' + ${course.timeRange} + ')'"></span> ·
            <span th:text="${course.classroom}"></span> ·
            <span th:text="${course.credit} + '학점'"></span>
        </p>
        <div class="summary">
            <div>평균 평점:
                <b th:if="${course.rated}" class="rating"
                   th:text="'★ ' + ${#numbers.formatDecimal(course.avgRating, 1, 1)}"></b>
                <span th:unless="${course.rated}" class="rating-none">아직 평가 없음</span>
                <span th:if="${course.rated}" class="rating-none"
                      th:text="'(' + ${reviewCount} + '개 평가)'"></span>
            </div>
            <div>여석:
                <b th:text="${course.capacity - course.enrolledCount} + ' / ' + ${course.capacity}"></b>
            </div>
        </div>
    </div>

    <!-- 평가 작성 -->
    <div class="card">
        <h3 style="margin-bottom:4px;" th:text="${myReview != null} ? '내 평가 수정' : '강의평가 작성'">강의평가 작성</h3>
        <p class="subtitle">평점과 한줄 후기를 남겨주세요. (학생당 강의별 1건, 언제든 수정 가능)</p>

        <form method="post" th:action="@{/reviews}" class="toolbar" style="align-items:flex-start;">
            <input type="hidden" name="courseId" th:value="${course.id}">
            <select name="rating" required>
                <option value="">평점</option>
                <option th:each="n : ${ {5,4,3,2,1} }"
                        th:value="${n}"
                        th:text="${n} + '점'"
                        th:selected="${myReview != null and myReview.rating == n}"></option>
            </select>
            <input type="text" name="comment" maxlength="200" style="flex:1; min-width:280px;"
                   placeholder="한줄 후기 (예: 과제는 많지만 배우는 게 확실해요)"
                   th:value="${myReview != null} ? ${myReview.comment} : ''">
            <button type="submit" class="btn btn-primary btn-sm"
                    th:text="${myReview != null} ? '수정' : '등록'">등록</button>
        </form>
        <form th:if="${myReview != null}" method="post" th:action="@{/reviews/delete}" style="margin-top:8px;">
            <input type="hidden" name="courseId" th:value="${course.id}">
            <button type="submit" class="btn btn-danger btn-sm">내 평가 삭제</button>
        </form>
    </div>

    <!-- 평가 목록 -->
    <div class="card">
        <h3 style="margin-bottom:14px;" th:text="'강의평가 (' + ${reviewCount} + ')'">강의평가</h3>

        <div th:if="${reviews.isEmpty()}" style="color:#999; padding:14px 0;">
            아직 등록된 평가가 없습니다. 첫 평가를 남겨보세요!
        </div>

        <div th:each="r : ${reviews}" class="review-item">
            <div class="review-head">
                <span class="rating" th:text="'★ ' + ${r.rating} + ' / 5'"></span>
                <span class="review-author"
                      th:text="${r.student.department} + ' ' + ${r.student.grade} + '학년'">작성자</span>
                <span class="review-date" th:text="${#temporals.format(r.createdAt, 'yyyy-MM-dd')}"></span>
            </div>
            <div class="review-body" th:text="${r.comment != null and !r.comment.isEmpty()} ? ${r.comment} : '(후기 없음)'">후기</div>
        </div>
    </div>

</div>
</body>
</html>
