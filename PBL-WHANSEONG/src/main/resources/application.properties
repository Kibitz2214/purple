spring.application.name=pbl-sugang

# ===== Server (8081: foodguard uses 8080/8000, avoid conflict) =====
server.port=8081

# ===== Database =====
# 접속 정보는 환경변수로 주입한다. 비밀번호를 저장소에 커밋하지 않기 위한 것이며,
# 환경변수가 없으면 아래 기본값(로컬 MySQL)으로 동작한다.
#   DB_URL / DB_USERNAME / DB_PASSWORD
# 원격 DB로 실행하려면 run-remote.ps1 을 사용한다 (이 스크립트는 커밋되지 않는다).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/PBL?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== Encoding =====
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
